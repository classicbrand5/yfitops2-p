name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed for auto-commit of lockfile
      deployments: write    # needed for Cloudflare Pages action to create a deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (allow lockfile update)
        run: |
          # Ensure monaco-editor is present (Phase 5)
          if ! grep -q '"monaco-editor"' package.json; then
            npm install monaco-editor@^0.52.0 --save
          fi
          npm install   # will regenerate lockfile if needed

      - name: Commit updated lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update package-lock.json [skip ci]"
          file_pattern: "package-lock.json"
          commit_options: "--no-verify"
          skip_fetch: false
          skip_dirty_check: false
          push_options: ""
        # This action will only commit and push if the file has changed

      - name: Build the project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: yfitops2
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}